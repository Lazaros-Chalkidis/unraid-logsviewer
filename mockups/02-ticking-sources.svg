<svg xmlns="http://www.w3.org/2000/svg" width="780" height="350" viewBox="0 0 780 350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Ticking log sources on a settings tab"><title>Ticking log sources on a settings tab</title><rect width="780" height="350" rx="6" fill="#1a1a1a"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#42a5f5"/></marker></defs><rect x="14" y="14" width="126" height="23" rx="3" fill="#242424" stroke="rgba(244,125,66,.45)"/><text x="77" y="29.5" fill="rgba(255,255,255,.85)" font-size="10" text-anchor="middle" font-weight="600" xml:space="preserve">Dashboard Widget</text><rect x="142" y="14" width="84" height="23" rx="3" fill="#1e1e1e" stroke="rgba(255,255,255,.10)"/><text x="184" y="29.5" fill="rgba(255,255,255,.45)" font-size="10" text-anchor="middle" font-weight="600" xml:space="preserve">Tool Page</text><rect x="228" y="14" width="96" height="23" rx="3" fill="#1e1e1e" stroke="rgba(255,255,255,.10)"/><text x="276" y="29.5" fill="rgba(255,255,255,.45)" font-size="10" text-anchor="middle" font-weight="600" xml:space="preserve">Backup Logs</text><rect x="326" y="14" width="66" height="23" rx="3" fill="#1e1e1e" stroke="rgba(255,255,255,.10)"/><text x="359" y="29.5" fill="rgba(255,255,255,.45)" font-size="10" text-anchor="middle" font-weight="600" xml:space="preserve">Alerts</text><text x="754" y="29.5" fill="#42a5f5" font-size="10.5" text-anchor="end" font-weight="600" xml:space="preserve">Each tab keeps its own ticks</text><path d="M548 26L402 26" fill="none" stroke="#42a5f5" stroke-width="1.6" marker-end="url(#a)"/><rect x="14" y="41" width="752" height="256" rx="4" fill="#242424" stroke="rgba(255,255,255,.10)"/><rect x="22" y="49" width="736" height="22" rx="3" fill="#2e2e2e" stroke="rgba(255,255,255,.10)"/><text x="32" y="64" fill="rgba(255,255,255,.85)" font-size="11" text-anchor="start" font-