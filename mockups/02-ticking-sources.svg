 y="193.5" fill="rgba(255,255,255,.65)" font-size="8.5" text-anchor="middle" font-weight="500" xml:space="preserve">Select All</text><rect x="103" y="182" width="68" height="17" rx="3" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.15)"/><text x="137" y="193.5" fill="rgba(255,255,255,.65)" font-size="8.5" text-anchor="middle" font-weight="500" xml:space="preserve">Deselect All</text><rect x="30" y="208" width="720" height="83" rx="3" fill="#1c1c1c" stroke="rgba(255,255,255,.10)"/><rect x="30" y="208" width="720" height="20" rx="3" fill="#2e2e2e" stroke="rgba(255,255,255,.10)"/><text x="40" y="222" fill="rgba(255,255,255,.85)" font-size="10.5" text-anchor="start" font-weight="600" xml:space="preserve">Docker Containers Log</text><path d="M734.6 219.7l3.4 -3.4 3.4 3.4z" fill="rgba(255,255,255,.30)"/><rect x="30.5" y="228" width="719" height="20" fill="#1e1e1e"/><rect x="30.5" y="228" width="170" height="20" fill="rgba(0,0,0,.20)"/><rect x="40" y="232.5" width="11" height="11" rx="2" fill="none" stroke="#42a5f5" stroke-width="1.2"/><path d="M42.4 238.1l2.2 2.2 4 -4.4" fill="none" stroke="#42a5f5" stroke-width="1.5"/><text x="58" y="242" fill="rgba(255,255,255,.85)" font-size="10.5" text-anchor="start" font-weight="600" xml:space="preserve">plex</text><circle cx="216" cy="238" r="2.6" fill="#2ecc71"/><text x="224" y="241.5" fill="rgba(255,255,255,.65)" font-size="9.5" text-anchor="start" font-weight="normal" xml:space="preserve">running</text><text x="740" y="241.5" fill="rgba(255,255,255,.65)" font-size="9.5" text-anchor="end" font-weight="normal" xml:space="preserve">3.4 MB</text><rect x="30.5" y="248" width="719" height="20" fill="#1a1a1a"/><rect x="30.5" y="248" width="170" height="20" fill="rgba(0,0,0,.20)"/><rect x="40" y="252.5" width="11" height="11" rx="2" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.2"/><text x="58" y="262" fill="rgba(255,255,255,.85)" font-size="10.5" text-anchor="start" font-weight="600" xml:space="preserve">old-backup</text><circle cx="216" cy="258" r="2.6" fill="#e74c3c"/><text x="224" y="261.5" fill="rgba(255,255,255,.65)" font-size="9.5" text-anchor="start" font-weight="normal" xml:space="preserve">exited</text><text x="740" y="261.5" fill="rgba(255,255,255,.65)" font-size="9.5" text-anchor="end" font-weight="normal" xml:space="preserve">12.4 KB</text><path d="M30.5 268L749.5 268" stroke="rgba(255,255,255,.06)" stroke-width="1"/><rect x="40" y="271" width="58" height="17" rx="3" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.15)"/><text x="69" y="282.5" fill="rgba(255,255,255,.65)" font-size="8.5" text-anchor="middle" font-weight="500" xml:space="preserve">Select All</text><rect x="103" y="271" width="68" height="17" rx="3" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.15)"/><text x="137" y="282.5" fill="rgba(255,255,255,.65)" font-size="8.5" text-anchor="middle" font-weight="500" xml:space="preserve">Deselect All</text><rect x="688" y="271" width="52" height="17" rx="3" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.15)"/><path d="M704 279.5a4 4 0 1 1-1.4-3" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="1.3"/><path d="M703.6 274v3h-3" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="1.3"/><text x="721" y="282.5" fill="rgba(255,255,255,.65)" font-size="8.5" text-anchor="middle" font-weight="500" xml:space="preserve">Scan</text><text x="26" y="318" fill="#42a5f5" font-size="10.5" text-anchor="start" font-weight="600" xml:space="preserve">A greyed row cannot be ticked: there is nothing in that log yet.</text><text x="26" y="336" fill="#42a5f5" font-size="10.5" text-anchor="start" font-weight="600" xml:space="preserve">Scan looks again, for a container that was added after the page opened.</text></svg>
