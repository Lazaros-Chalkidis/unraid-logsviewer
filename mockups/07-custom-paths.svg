<svg xmlns="http://www.w3.org/2000/svg" width="780" height="262" viewBox="0 0 780 262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Custom log paths, with a date placeholder"><title>Custom log paths, with a date placeholder</title><rect width="780" height="262" rx="6" fill="#1a1a1a"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#42a5f5"/></marker></defs><rect x="14" y="14" width="752" height="24" rx="3" fill="#2e2e2e" stroke="rgba(255,255,255,.10)"/><text x="26" y="30" fill="rgba(255,255,255,.85)" font-size="11" text-anchor="start" font-weight="600" xml:space="preserve">Custom log paths</text><rect x="678" y="19" width="58" height="14" rx="3" fill="rgba(255,140,0,.08)" stroke="rgba(255,140,0,.5)"/><path d="M687 27l2-2M686.5 24.5l1.5-1.5a2 2 0 0 1 3 3l-1.5 1.5M689.5 27.5l-1.5 1.5a2 2 0 0 1-3-3l1.5-1.5" fill="none" stroke="#f47d42" stroke-width="1.1"/><text x="712" y="29.3" fill="rgba(255,255,255,.65)" font-size="8.5" text-anchor="middle" font-weight="normal" xml:space="preserve">Shared</text><path d="M745.6 27.7l3.4 -3.4 3.4 3.4z" fill="rgba(255,255,255,.30)"/><rect x="14" y="38" width="752" height="170" rx="4" fill="#242424" stroke="rgba(255,255,255,.10)"/><rect x="26" y="46" width="596" height="16" rx="2" fill="rgba(255,179,0,.10)"/><rect x="26" y="46" width="2.5" height="16" fill="#ffb300"/><circle cx="37" cy="54" r="4" fill="none" stroke="#ffb300" stroke-width="1"/><path d="M37 53.6v2.6" fill="none" stroke="#ffb300" stroke-width="1.1"/><circle cx="37" cy="52" r="0.6" fill="#ffb300"/><text x="46" y="57.3" font-size="9.5" text-anchor="start" xml:space="preserve"><tspan fill="#ffb300" font-weight="600">Shared definitions.</tspan><tspan fill="rgba(255,255,255,.85)"> Custom log paths defined here apply across Tool page, Dashboard widget, Alerts and Backup.</tspan></text><rect x="26" y="66" width="290" height="16" rx="2" fill="rgba(255,179,0,.10)"/><rect x="26" y="66" width="2.5" height="16" fill="#ffb300"/><text x="36" y="77.3" font-size="9.5" text-anchor="start" xml:space="preserve"><tspan fill="rgba(255,255,255,.85)">Allowed prefixes: </tspan><tspan fill="rgba(255,255,255,.65)">/var/log/</tspan><tspan fill="rgba(255,255,255,.85)">, </tspan><tspan fill="rgba(255,255,255,.65)">/mnt/user/</tspan><tspan fill="rgba(255,255,255,.85)">, </tspan><tspan fill="rgba(255,255,255,.65)">/mnt/cache/</tspan><tspan fill="rgba(255,255,255,.85)">.</tspan></text><rect x="26" y="86" width="400" height="16" rx="2" fill="rgba(255,179,0,.10)"/><rect x="26" y="86" width="2.5" height="16" fill="#ffb300"/><text x="36" y="97.3" font-size="9.5" text-anchor="start" xml:space="preserve"><tspan fill="rgba(255,255,255,.85)">Date placeholders: </tspan><tspan fill="rgba(255,255,255,.65)">{YYYY}</tspan><tspan fill="rgba(255,255,255,.85)">, </tspan><tspan fill="rgba(255,255,255,.65)">{MM}</tspan><tspan fill="rgba(255,255,255,.85)"> and </tspan><tspan fill="rgba(255,255,255,.65)">{DD}</tspan><tspan fill="rgba(255,255,255,.85)"> are replaced with today's date.</tspan></text><rect x="26" y="110" width="728" height="28" rx="3" fill="#1c1c1c" stroke="rgba(255,255,255,.07)"/><rect x="34" y="114" width="172" height="20" rx="3" fill="#262626" stroke="rgba(255,255,255,.12)"/><text x="42" y="127.5" fill="rgba(255,255,255,.85)" font-size="10" text-anchor="start" font-weight="normal" xml:space="preserve">App audit</text><rect x="214" y="114" width="502" height="20" rx="3" fill="#262626" stroke="rgba(255,255,255,.12)"/><text x="222" y="127.5" fill="rgba(255,255,255,.85)" font-size="10" text-anchor="start" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" textLength="186" xml:space="preserve">/mnt/user/appdata/app/audit.log</text><rect x="724" y="114" width="22" height="20" rx="3" fill="none" stroke="rgba(255,255,255,.12)"/><path d="M730 121h10M732 121v8h6v-8M733.5 119h3" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.1"/><rect x="26" y="142" width="728" height="28" rx="3" fill="#1c1c1c" stroke="rgba(255,255,255,.07)"/><rect x="34" y="146" width="172" height="20" rx="3" fill="#262626" stroke="rgba(255,255,255,.12)"/><text x="42" y="159.5" fill="rgba(255,255,255,.85)" font-size="10" text-anchor="start" font-weight="normal" xml:space="preserve">Hosts nginx</text><rect x="214" y="146" width="502" height="20" rx="3" fill="#262626" stroke="#42a5f5"/><text x="222" y="159.5" fill="rgba(255,255,255,.85)" font-size="10" text-anchor="start" font-weight="normal" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" textLength="288" xml:space="preserve">/var/log/hosts/{YYYY}/{MM}/{DD}/nginx/access.log</text><rect x="724" y="146" width="22" height="20" rx="3" fill="none" stroke="rgba(255,255,255,.12)"/><path d="M730 153h10M732 153v8h6v-8M733.5 151h3" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.1"/><rect x="26" y="178" width="70" height="19" rx="3" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.15)"/><text x="61" y="190.5" fill="rgba(255,255,255,.65)" font-size="8.5" text-anchor="middle" font-weight="500" xml:space="preserve">+ Add row</text><path d="M330 220L330 168" fill="none" stroke="#42a5f5" stroke-width="1.6" marker-end="url(#a)"/><text x="26" y="230" fill="#42a5f5" font-size="10.5" text-anchor="start" font-weight="600" xml:space="preserve">Today that row opens /var/log/hosts/2026/11/11/nginx/access.log. Tomorrow, the folder of the 12th.</text><text x="26" y="248" fill="#42a5f5" font-size="10.5" text-anchor="start" font-weight="600" xml:space="preserve">The label is the name the log gets in every list.</text></svg>
